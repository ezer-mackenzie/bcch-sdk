codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: 70..100
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

flags:
  unit-tests:
    paths:
      - src/bcch_sdk/
    carryforward: false

ignore:
  - tests/
