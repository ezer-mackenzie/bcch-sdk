[project]
name = "bcch-sdk"
version = "2.0.0"
description = "Python SDK for the Banco Central de Chile SieteRestWS API."
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz",email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "banco-central-chile",
    "bcch",
    "central-bank",
    "economic-data",
    "siete",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx[brotli,zstd] (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx-retries (>=0.6.0,<0.7.0)",
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.3,<4.0.0"]
polars = ["polars>=1.42.1,<2.0.0"]
dataframe = [
    "pandas>=3.0.3,<4.0.0",
    "polars>=1.42.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ezer-mackenzie/bcch-sdk"
Documentation = "https://ezer-mackenzie.github.io/bcch-sdk/"
Repository = "https://github.com/ezer-mackenzie/bcch-sdk"
Issues = "https://github.com/ezer-mackenzie/bcch-sdk/issues"
Changelog = "https://github.com/ezer-mackenzie/bcch-sdk/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "bcch_sdk", from = "src" }]

[tool.poetry.group.dev.dependencies]
mypy = ">=2.3.1,<3.0.0"
pre-commit = ">=4.0.0,<5.0.0"
ruff = ">=0.15.20,<0.16.0"

[tool.poetry.group.test.dependencies]
pandas = ">=3.0.3,<4.0.0"
polars = ">=1.42.1,<2.0.0"
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-benchmark = ">=5.2.3,<6.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.1,<2.0.0"

[tool.pytest.ini_options]
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: performance and memory benchmarks excluded from the default test run",
]

[tool.coverage.run]
branch = true
source = ["bcch_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
packages = ["bcch_sdk"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
