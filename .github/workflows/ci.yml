name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        if: matrix.python-version == '3.12'
        run: poetry run ruff check .

      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: poetry run ruff format --check .

      - name: Run type checking
        if: matrix.python-version == '3.12'
        run: poetry run mypy

      - name: Validate package metadata
        if: matrix.python-version == '3.12'
        run: poetry check --strict

      - name: Run tests with coverage
        run: >-
          poetry run pytest -q
          --cov=bcch_sdk
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Store coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build package
        if: matrix.python-version == '3.12'
        run: poetry build

      - name: Validate wheel install
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/bcch-sdk-wheel-test
          /tmp/bcch-sdk-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/bcch-sdk-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/bcch-sdk-wheel-test/bin/python -c "import importlib.util; import bcch_sdk; from bcch_sdk import BCChSyncSDK, BCChConfig, Frequency, SeriesInformation; assert importlib.util.find_spec('pandas') is None; assert importlib.util.find_spec('polars') is None; print(bcch_sdk.__version__, BCChSyncSDK.__name__, BCChConfig.__name__, Frequency.DAILY.value, SeriesInformation.__name__)"

      - name: Build documentation
        if: matrix.python-version == '3.12'
        run: poetry run mkdocs build --strict

  codecov:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
