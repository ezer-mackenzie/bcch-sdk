name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check .

      - name: Run tests with coverage
        run: >-
          poetry run pytest -q
          --cov=bcch_sdk
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build package
        run: poetry build

      - name: Validate wheel install
        run: |
          python -m venv /tmp/bcch-sdk-wheel-test
          /tmp/bcch-sdk-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/bcch-sdk-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/bcch-sdk-wheel-test/bin/python -c "import bcch_sdk; from bcch_sdk import BCChSyncSDK, BCChConfig, Frequency, SeriesInformation; print(bcch_sdk.__version__, BCChSyncSDK.__name__, BCChConfig.__name__, Frequency.DAILY.value, SeriesInformation.__name__)"

  codecov:
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/codecov.yml
    secrets: inherit
